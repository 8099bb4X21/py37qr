name: Probe QR perf ARM64

# 发版要挂 Release 附件，与 build/android 一致需写权限。
permissions:
  contents: write

on:
  # 手动触发：Actions 页选本工作流点 Run workflow，
  # 跑完在 Artifacts 下载 Probe_tool_日期.zip，解压到 UOS 直接跑 probe_tool。
  workflow_dispatch:
  push:
    tags:
      # 同 build/android：`?` 在 tag 过滤里不生效，用 `*`。
      - '20*'

jobs:
  probe:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build probe tool inside ARM64 Debian 10 container
        env:
          # 与 build.yml 一致：tag 名即日期版，手动触发则脚本内取当天日期。
          TAG_DATE: ${{ github.ref_name }}
        run: |
          docker run --rm \
            -e TAG_DATE \
            -e GITHUB_REF \
            -v ${{ github.workspace }}:/workspace:Z \
            -w /workspace \
            arm64v8/debian:10-slim \
            bash .github/scripts/probe-qr.sh

      - name: Upload probe tool
        uses: actions/upload-artifact@v4
        with:
          name: probe-tool-debian10-arm64
          path: dist/Probe_tool_*.zip
          if-no-files-found: error

      # 注意：GitHub Release 附件 API 会剥离中文文件名（20261005 已验证三次），
      # 探针中文包不再自动挂 Release，改手动上传；误用 softprops 会复造坏附件。
