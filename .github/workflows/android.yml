name: Build Android APK

# 发版要建 Release + 传附件，默认 token 可能只有读权限，这里显式要写权限。
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：它会装已下架的 tools 包导致失败。
      # 直接用 runner 自带 SDK，只补装目标平台与构建工具。
      - name: Install Android packages
        run: |
          for cand in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -x "$cand/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$cand/cmdline-tools/latest/bin/sdkmanager"
              echo "ANDROID_HOME=$cand" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "${SDKMANAGER:-}" ]; then
            echo "sdkmanager not found"
            ls /usr/local/lib/android/sdk 2>/dev/null || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 与《云编译/签名密钥配置说明.md》同一套密钥：base64 解码出 keystore，
      # 参数追加到 gradle.properties（仅 runner 本地，不进仓库）。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 注意 keystore 路径是相对 app 模块目录解析的，所以解码到 app/ 下。
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          {
            echo "KEYSTORE_FILE=release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Assemble release APK
        run: gradle assembleRelease --no-daemon -PVERSION_CODE=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: py37qr-android-apk
          path: App/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create Release (on tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: App/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
