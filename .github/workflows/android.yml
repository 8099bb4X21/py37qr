name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'App/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：它会装已下架的 tools 包导致失败。
      # 直接用 runner 自带 SDK，只补装目标平台与构建工具。
      - name: Install Android packages
        run: |
          for cand in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -x "$cand/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$cand/cmdline-tools/latest/bin/sdkmanager"
              echo "ANDROID_HOME=$cand" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "${SDKMANAGER:-}" ]; then
            echo "sdkmanager not found"
            ls /usr/local/lib/android/sdk 2>/dev/null || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: py37qr-android-apk
          path: App/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
