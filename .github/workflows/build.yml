name: Build py37qr ARM64

# 同上，发版需要写权限。
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      # 日期版 tag（如 20261004）。注意 `?` 通配在 tag 过滤里不生效（实测不触发），用 `*`。
      - '20*'

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build inside ARM64 Debian 10 container
        env:
          # tag 触发时把 tag 名（即日期版）传进去打 zip 包名；手动触发则脚本内取当天日期。
          TAG_DATE: ${{ github.ref_name }}
        run: |
          docker run --rm \
            -e TAG_DATE \
            -v ${{ github.workspace }}:/workspace:Z \
            -w /workspace \
            arm64v8/debian:10-slim \
            bash .github/scripts/build-qr.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: py37qr-debian10-arm64
          path: dist/QR_tool_*.zip
          if-no-files-found: error

      - name: Create Release (on tag push only)
        if: startsWith(github.ref, 'refs/tags/20')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/QR_tool_*.zip
          generate_release_notes: true
