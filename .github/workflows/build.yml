name: Build py37qr ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build inside ARM64 Debian 10 container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace:Z \
            -w /workspace \
            arm64v8/debian:10-slim \
            bash .github/scripts/build-qr.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: py37qr-debian10-arm64
          path: |
            dist/qr_tool
            dist/qr_config.ini
            dist/qr_tool.desktop
            dist/qr_tool.svg
            dist/install.sh
          if-no-files-found: error

      - name: Create Release (on tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/qr_tool
            dist/qr_config.ini
            dist/qr_tool.desktop
            dist/qr_tool.svg
            dist/install.sh
          generate_release_notes: true
